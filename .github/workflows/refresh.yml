name: Refresh data

on:
  schedule:
    - cron: '23 4 1 * *'   # 1st of each month, 04:23 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install requests beautifulsoup4
      - name: Crawl all PL clubs
        run: python scripts/crawl.py --delay 1.2
      - name: Commit dataset if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pl-connections.json
          git diff --cached --quiet || git commit -m "chore: refresh PL connections dataset $(date -u +%F)"
          git push
